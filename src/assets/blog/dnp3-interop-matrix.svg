<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="IBM Plex Sans, Segoe UI, sans-serif" role="img" aria-label="go-dnp3 tested in both roles against four independent DNP3 implementations: the masters of Step Function I/O, opendnp3, DSC go-dnp3 and dnp3py poll go-dnp3 as the outstation, and go-dnp3 as the master polls their outstations, over TCP, TLS, UDP and serial.">
